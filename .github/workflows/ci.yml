name: Validate CRM

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate project and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
      - name: Test backend
        run: python manage.py test
      - name: Check JavaScript syntax
        run: node --check clients/static/clients/app.js
      - name: Build Docker image
        run: docker build -t nexo-crm:ci .
      - name: Smoke test container
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" >> "$GITHUB_ENV"
          docker compose up -d --build --wait --wait-timeout 90
          curl --fail http://127.0.0.1:8000/health/
          curl --fail http://127.0.0.1:8000/login/
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs || true
          docker compose down || true
